name: Deploy EVIRMA Chatwoot

# EVIRMA: push events do not start workflows in this fork, while pull_request events do,
# so a merged pull request into evirma/main is the release trigger.
on:
  pull_request:
    types: [closed]
    branches:
      - evirma/main
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA (empty uses the workflow commit)
        required: false
        type: string

permissions: {}

concurrency:
  group: evirma-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SHA: ${{ inputs.sha || github.event.pull_request.merge_commit_sha || github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.EVIRMA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.EVIRMA_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.EVIRMA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EVIRMA_DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.EVIRMA_DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[[:xdigit:]]{40}$ ]] || { echo 'Expected a full 40-character hex SHA'; exit 2; }
          umask 077
          key_file="$RUNNER_TEMP/evirma-deploy-key"
          hosts_file="$RUNNER_TEMP/evirma-deploy-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=180 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
